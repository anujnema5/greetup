# greetup-rtc droplet — Redis + rtc-service + Caddy (HTTPS)
# On VM: ~/greetup/docker-compose.yml

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --bind 0.0.0.0 --protected-mode yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --appendonly yes
    network_mode: host

  rtc-service:
    image: ${RTC_IMAGE}
    restart: always
    network_mode: host
    environment:
      NODE_ENV: production
      RTC_HOST: 0.0.0.0
      RTC_PORT: 5370
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 49999
      WEBRTC_LISTEN_IP: 0.0.0.0
      WEBRTC_ANNOUNCED_IP: ${VM_PUBLIC_IP}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RTC_JWT_SECRET: ${RTC_JWT_SECRET}
      WEB_CLIENT_HOST: ${WEB_CLIENT_HOST}
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:6379

  caddy:
    image: caddy:2-alpine
    restart: always
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Polls DO registry and recreates rtc-service when :latest changes (no SSH from GitHub Actions).
  # Uses nickfedor/watchtower — containrrr/watchtower is unmaintained and breaks on Docker 29+ (API 1.40+).
  # Requires `docker login registry.digitalocean.com` on the droplet once.
  watchtower:
    image: nickfedor/watchtower:1.12.1
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
    command: --interval 300 rtc-service

volumes:
  caddy_data:
  caddy_config:
