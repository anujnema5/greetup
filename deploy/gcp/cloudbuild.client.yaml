# Next.js client — public URLs are baked at Docker build time (set on trigger or below).

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: greetup
  _IMAGE: client
  _SERVICE: client
  _PORT: "3000"
  _CPU: "1"
  _MEMORY: 512Mi
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _NEXT_PUBLIC_API_BASE_URL: https://api.greetup.co/api
  _NEXT_PUBLIC_SOCKET_SERVER_URL: https://api.greetup.co
  _NEXT_PUBLIC_RTC_SOCKET_URL: https://rtc.greetup.co
  _NEXT_PUBLIC_APP_URL: https://greetup.co
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
  _NEXT_PUBLIC_FIREBASE_APP_ID: ""
  _NEXT_PUBLIC_GA_MEASUREMENT_ID: G-CK6WRFYXTS

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - "VERIFY_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}"
      - "VERIFY_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
      - "VERIFY_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "$$VERIFY_FIREBASE_API_KEY" ] || [ -z "$$VERIFY_FIREBASE_AUTH_DOMAIN" ] || [ -z "$$VERIFY_FIREBASE_PROJECT_ID" ]; then
          echo ""
          echo "ERROR: Firebase client config is missing at Docker build time."
          echo "Fix: Cloud Build trigger -> Substitution variables (names must include leading _):"
          echo "  _NEXT_PUBLIC_FIREBASE_API_KEY"
          echo "  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
          echo "  _NEXT_PUBLIC_FIREBASE_PROJECT_ID"
          echo "  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          echo "  _NEXT_PUBLIC_FIREBASE_APP_ID"
          echo ""
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    dir: client
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SOCKET_SERVER_URL=${_NEXT_PUBLIC_SOCKET_SERVER_URL}
      - --build-arg
      - NEXT_PUBLIC_RTC_SOCKET_URL=${_NEXT_PUBLIC_RTC_SOCKET_URL}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - ${_PORT}
      - --cpu
      - ${_CPU}
      - --memory
      - ${_MEMORY}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$BUILD_ID
