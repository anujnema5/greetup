# Production — Next.js client (bakes NEXT_PUBLIC_* at build time).
#
# Before first use:
# 1. Replace every YOUR-PROD-* placeholder in substitutions (or override in the Cloud Build trigger).
# 2. Prefer a separate GCP project from development; if you reuse one project, change _SERVICE (e.g. client-prod).
# 3. Point a trigger at this file (e.g. branch `main`), not at cloudbuild.client.yaml.
#
# Development builds: deploy/gcp/cloudbuild.client.yaml

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: greetup
  _IMAGE: client
  _SERVICE: client
  _PORT: "3000"
  _CPU: "1"
  _MEMORY: 512Mi
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _NEXT_PUBLIC_API_BASE_URL: https://api.YOUR-PROD-DOMAIN/api
  _NEXT_PUBLIC_SOCKET_SERVER_URL: https://api.YOUR-PROD-DOMAIN
  _NEXT_PUBLIC_RTC_SOCKET_URL: https://rtc.YOUR-PROD-DOMAIN
  _NEXT_PUBLIC_APP_URL: https://YOUR-PROD-DOMAIN
  # Firebase Console → Project settings → Your apps → Web app config (set on trigger or replace here).
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
  _NEXT_PUBLIC_FIREBASE_APP_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Fail fast if Firebase vars never reached Docker (trigger must define _NEXT_PUBLIC_FIREBASE_* — not Cloud Run env).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - "VERIFY_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}"
      - "VERIFY_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
      - "VERIFY_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "$$VERIFY_FIREBASE_API_KEY" ] || [ -z "$$VERIFY_FIREBASE_AUTH_DOMAIN" ] || [ -z "$$VERIFY_FIREBASE_PROJECT_ID" ]; then
          echo ""
          echo "ERROR: Firebase client config is missing at Docker build time."
          echo "On the Cloud Build trigger, add user-defined substitution variables whose names are EXACTLY:"
          echo "  _NEXT_PUBLIC_FIREBASE_API_KEY"
          echo "  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
          echo "  _NEXT_PUBLIC_FIREBASE_PROJECT_ID"
          echo "  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          echo "  _NEXT_PUBLIC_FIREBASE_APP_ID"
          echo "(Leading underscore is required. Names like NEXT_PUBLIC_FIREBASE_API_KEY without _ are ignored.)"
          echo "Cloud Run service env vars do not bake into the Next.js bundle — rebuild after fixing the trigger."
          echo ""
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    dir: client
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$SHORT_SHA
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SOCKET_SERVER_URL=${_NEXT_PUBLIC_SOCKET_SERVER_URL}
      - --build-arg
      - NEXT_PUBLIC_RTC_SOCKET_URL=${_NEXT_PUBLIC_RTC_SOCKET_URL}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - ${_PORT}
      - --cpu
      - ${_CPU}
      - --memory
      - ${_MEMORY}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE}:$SHORT_SHA
