services:
  rtc-service:
    image: ${RTC_IMAGE}
    restart: always
    environment:
      NODE_ENV: production
      RTC_HOST: 0.0.0.0
      RTC_PORT: 5370
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 49999
      WEBRTC_LISTEN_IP: 0.0.0.0
      WEBRTC_ANNOUNCED_IP: ${VM_PUBLIC_IP}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RTC_JWT_SECRET: ${RTC_JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
    network_mode: host
