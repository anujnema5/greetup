version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: circlo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: circlo_db
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: circlo_redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: circlo_server
    ports:
      - "5050:5050"
    volumes:
      - ./server:/app
      - /app/node_modules  # keep container node_modules, use host source
    env_file:
      - ./server/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: "UseFsEventsWithFallbackDynamicPolling"
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: circlo_client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: development
      # Optional: enable if file changes don't trigger reload (e.g. on Windows)
      WATCHPACK_POLLING: "true"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data: