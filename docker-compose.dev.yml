version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4 
    container_name: greetup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greetup_db
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: greetup_redis
    restart: unless-stopped
    ports:
      # Avoid 16379 on Windows: it often falls in Hyper-V excluded port ranges (no host bind).
      - "26379:6379"
    volumes:
      - redis_data:/data

  server:
    profiles: ["app"]
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: greetup_server
    ports:
      - "5300:5300"
    volumes:
      - ./server:/app
      - /app/node_modules  # keep container-installed deps (Bun), use host source
    env_file:
      - ./server/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: "UseFsEventsWithFallbackDynamicPolling"
    depends_on:
      - postgres
      - redis

  client:
    profiles: ["app"]
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: greetup_client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: development
      # Optional: enable if file changes don't trigger reload (e.g. on Windows)
      WATCHPACK_POLLING: "true"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data: